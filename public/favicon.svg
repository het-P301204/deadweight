<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DEADWEIGHT">
  <!--
    The load stripe: six cells, one per stage of the pipeline, with the third
    -- execution -- flagged. The product's glyph is its mark.
  -->
  <rect width="32" height="32" rx="6" fill="#0A0C10" />
  <g>
    <rect x="5" y="12" width="3" height="8" rx="1" fill="#6E7B8D" />
    <rect x="9.6" y="12" width="3" height="8" rx="1" fill="#6E7B8D" />
    <rect x="14.2" y="8" width="3" height="16" rx="1" fill="#E85E5C" />
    <rect x="18.8" y="12" width="3" height="8" rx="1" fill="#6E7B8D" />
    <rect x="23.4" y="12" width="3" height="8" rx="1" fill="#6E7B8D" />
    <rect x="28" y="12" width="1.5" height="8" rx="0.75" fill="#3A4353" />
  </g>
</svg>
