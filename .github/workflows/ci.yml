name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 24 for the CLI: it runs the engine's TypeScript sources directly
          # through Node's native type stripping, with no build step.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # ----------------------------------------------------------------------
      # The two steps below assert the claims the product makes, rather than
      # that it compiles. A claim nothing checks is a claim nobody should
      # believe.
      #
      # They were thirteen shell steps that existed only in this file, which
      # meant they could not be run before pushing: a change could pass lint,
      # typecheck, the suite and the build locally and still fail here. That
      # happened, when a grep for JSON.parse matched a comment *about*
      # JSON.parse, and the first anyone knew of it was a failure email.
      #
      # They are one Node script now -- scripts/assert-claims.ts -- called by
      # this workflow and by `npm run verify`, so green locally means green
      # here. Reading the files in Node also lets the checks skip comment
      # lines, which a grep cannot do, and this is a project whose prose
      # discusses unpickling and decompression constantly.
      # ----------------------------------------------------------------------

      - name: Assert the generated artifacts match their generators
        # Four things are generated and committed. Each is checked rather than
        # trusted, so the demo project the browser analyses cannot drift from
        # the one the CLI is tested against.
        run: |
          node scripts/make-fixtures.ts --check
          node scripts/demo-tree.ts --check
          node scripts/error-pages.ts --check
          node scripts/docs-numbers.ts --check

      - name: Assert the product's claims
        # Twelve checks: the CLI runs from source, the exit codes are what the
        # README documents, the analysis is reproducible and free of
        # timestamps, no deserialising or decompressing call is reachable, the
        # engine reads no clock and no browser global, nothing in the bundle
        # can reach the network, the error pages stand alone, the demo is a
        # file list rather than a fixture of results, every loader rule is
        # documented, a deliberately hostile tree analyses inside a budget,
        # and a malformed BOM is refused with guidance.
        timeout-minutes: 5
        run: npm run assert-claims
